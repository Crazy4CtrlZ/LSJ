# Render Blueprint - single free-tier web service (rubric-recommended architecture)
services:
  - type: web
    name: lsj-hr-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set the real value in the Render dashboard
      - key: MODEL
        value: llama-3.3-70b-versatile
      - key: RETRIEVAL_K
        value: "4"
      - key: BUILD_INDEX_ON_START
        value: "1"           # index builds on first boot (adds to the first cold start; documented)
      - key: PYTHON_VERSION
        value: "3.11.9"
